services:
  vmsingle:
    image: victoriametrics/victoria-metrics:v1.155.0
    user: "1000:1000"
    ports:
      - "127.0.0.1:8428:8428"
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-6}"
    volumes:
      - type: bind
        source: /srv/volumes/try-vmsingle/vmsingle/vmdata
        target: /storage
        bind:
          create_host_path: false
    restart: unless-stopped
  otel-collector:
    ports:
      - "127.0.0.1:4318:4318"
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - vmsingle
    restart: unless-stopped

  go-builder:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/go-builder/Dockerfile
    working_dir: /src
    volumes:
      - ./sample-generator:/src:ro
      - ./bin:/out

  sample-generator:
    profiles: ["tools"]
    image: alpine:3.21
    working_dir: /app
    volumes:
      - ./bin:/app:ro
    command: ["/app/sample-generator"]
    environment:
      OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
    depends_on:
      - otel-collector

